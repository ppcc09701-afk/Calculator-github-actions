name: Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Message de bienvenue
        run: echo "Bienvenue dans Pipeline CI"
      - name: Lister les fichiers
        run: ls -la
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pytest
        run: pip install pytest
      - name: Lancer les tests
        run: pytest